name: Cortico
kind: company
description: >-
  Cortico (Cortico Health Technologies) is a Vancouver, British Columbia based
  healthcare connection platform, founded in 2019, that links patients, medical
  clinics, and health records across Canada and the United States. Its
  patient-engagement suite layers online booking, automated appointment
  reminders, secure two-way patient messaging, digital intake forms,
  telemedicine, specialist e-referrals, payments, and AI-driven administrative
  automation on top of the electronic medical records (EMRs) clinics already
  run — most notably a supported two-way integration with OSCAR EMR through that
  system's REST/SOAP web services, plus SMART on FHIR contextual launch and
  robotic process automation (RPA). Cortico is SOC 2 Type II and ISO 27001
  certified and compliant with HIPAA, PIPEDA, and PHIPA. Cortico consumes EMR
  and FHIR interfaces rather than publishing its own public developer API: as of
  this review there is no public developer portal, API reference, or FHIR
  CapabilityStatement, and integration is delivered through a partnership and
  onboarding model rather than self-serve API access.
